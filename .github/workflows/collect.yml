name: Collect news

on:
  schedule:
    # Times are UTC. Weekdays: ~7am, 11am, 3pm, 7pm US Eastern. Weekends: once.
    - cron: "0 12,16,20 * * 1-5"
    - cron: "0 0 * * 2-6"
    - cron: "0 15 * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect news
        run: python news_spotter.py collect

      - name: Commit new stories
        run: |
          git config user.name "news-spotter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests README.md
          if git diff --cached --quiet; then
            echo "No new stories."
          else
            git commit -m "news: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
